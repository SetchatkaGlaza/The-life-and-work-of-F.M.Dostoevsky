name: Validate static site
on:
  push:
    branches: ["main", "modern-redesign"]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required pages
        run: |
          test -f index.html
          test -f biography.html
          test -f chronology.html
          test -f works.html
          test -f ideas.html
          test -f petersburg.html
          test -f family.html
          test -f gallery.html
          test -f research.html
          test -f sources.html
          test -f styles.css
          test -f app.js
      - name: Check page assets
        run: |
          for page in index biography chronology works ideas petersburg family gallery research sources; do
            test -f "$page.html"
            grep -q 'styles.css' "$page.html"
            grep -q 'app.js' "$page.html"
          done
      - name: Check navigation targets
        run: |
          grep -RhoE 'href="[^"]+.html' *.html | sed 's/href="//' | sort -u | while read target; do
            test -f "$target"
          done
